name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - run: go test -race ./...
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Build Apple Silicon and Intel archives
        run: |
          mkdir -p .dist
          for arch in arm64 amd64; do
            CGO_ENABLED=0 GOOS=darwin GOARCH="$arch" go build -trimpath -o .dist/dustpan .
            tar -czf ".dist/dustpan-darwin-$arch.tar.gz" -C .dist dustpan -C "$GITHUB_WORKSPACE" LICENSE README.md
          done
          (cd .dist && sha256sum ./*.tar.gz > SHA256SUMS)
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes .dist/*.tar.gz .dist/SHA256SUMS
