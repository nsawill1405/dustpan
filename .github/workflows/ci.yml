name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - run: go test -race ./...
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - name: Exercise the macOS login agent
        if: runner.os == 'macOS'
        run: |
          if ! launchctl print "gui/$(id -u)" > /dev/null 2>&1; then
            echo "::warning::No macOS login session; skipping launch-agent smoke test."
            exit 0
          fi
          export HOME="$(mktemp -d)"
          bin="$HOME/dustpan"
          go build -o "$bin" .
          trap '"$bin" uninstall || true' EXIT
          mkdir -p "$HOME/Downloads" "$HOME/.config/dustpan"
          printf 'quiet_for = "1s"\nage_days = 0\n' > "$HOME/.config/dustpan/rules.toml"
          printf 'sample\n' > "$HOME/Downloads/sample.pdf.part"
          "$bin" install
          "$bin" status | grep 'Login agent: loaded'
          mv "$HOME/Downloads/sample.pdf.part" "$HOME/Downloads/sample.pdf"
          for attempt in {1..30}; do
            if test -f "$HOME/Downloads/Documents/sample.pdf"; then break; fi
            sleep 2
          done
          if ! test -f "$HOME/Downloads/Documents/sample.pdf"; then
            cat "$HOME/Library/Application Support/Dustpan"/watch*.log
            exit 1
          fi
          "$bin" undo
          grep -x sample "$HOME/Downloads/sample.pdf"
          "$bin" uninstall
          "$bin" status | grep 'Login agent: not loaded'

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Build Apple Silicon and Intel archives
        run: |
          mkdir -p .dist
          for arch in arm64 amd64; do
            CGO_ENABLED=0 GOOS=darwin GOARCH="$arch" go build -trimpath -o .dist/dustpan .
            tar -czf ".dist/dustpan-darwin-$arch.tar.gz" -C .dist dustpan -C "$GITHUB_WORKSPACE" LICENSE README.md
          done
          (cd .dist && sha256sum ./*.tar.gz > SHA256SUMS)
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes .dist/*.tar.gz .dist/SHA256SUMS
